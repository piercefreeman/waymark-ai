[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-waymark"
version = "0.1.0"
description = "Run Pydantic AI graphs with durable Waymark model and tool actions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mountaineer-di>=0.2",
  "pydantic-ai-slim>=2.21,<3",
  "waymark>=0.30.0",
]

[project.optional-dependencies]
openai = ["pydantic-ai-slim[openai]>=2.21,<3"]
web = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1"]
iceaxe = [
    "iceaxe>=0.16.0",
]

[dependency-groups]
dev = [
  "click>=8.1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "iceaxe>=0.16.0",
  "pydantic-ai-slim[openai]>=2.21,<3",
  "pytest>=8",
  "ruff>=0.12",
  "ty>=0.0.1a26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_waymark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "W"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["mountaineer_di.Depends"]

[tool.determystic]
paths_include = ["src", "tests", "examples"]
