[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-waymark"
version = "0.1.0"
description = "Run Pydantic AI graphs with durable Waymark model and tool actions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic-ai-slim>=2.21,<2.22",
  "waymark>=0.30.0.dev7,<0.31",
]

[project.optional-dependencies]
openai = ["pydantic-ai-slim[openai]>=2.21,<2.22"]
web = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1"]

[dependency-groups]
dev = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pytest>=8",
  "ruff>=0.12",
  "ty>=0.0.1a26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_waymark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "W"]
