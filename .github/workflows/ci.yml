name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Clone Determystic
        run: git clone --depth 1 https://github.com/piercefreeman/deterministic.git ../deterministic

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run linting
        run: |
          uv run ruff format --check src tests examples scripts
          uv run ruff check src tests examples scripts
          uv run ty check src tests examples scripts
          uv run --with-editable ../deterministic determystic validate

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waymark_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WAYMARK_AI_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/waymark_ai_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

  pydantic-ai-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Pydantic AI compatibility matrix
        id: generate
        run: |
          {
            echo 'matrix<<EOF'
            uv run scripts/version_matrix.py --package pydantic-ai-slim --minimum 2.21
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  pydantic-ai-compat:
    name: pydantic-ai ${{ matrix.label }}
    needs: [pydantic-ai-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.pydantic-ai-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies with ${{ matrix.package }} ${{ matrix.version }}
        run: |
          uv sync --frozen
          uv pip install "${{ matrix.package }}[openai]==${{ matrix.version }}"
          uv pip show ${{ matrix.package }} pydantic-graph openai

      - name: Run tests
        run: uv run --no-sync pytest

  waymark-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Waymark compatibility matrix
        id: generate
        run: |
          {
            echo 'matrix<<EOF'
            uv run scripts/version_matrix.py --package waymark --minimum 0.30 --limit 5
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  waymark-compat:
    name: waymark ${{ matrix.label }}
    needs: [waymark-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.waymark-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies with ${{ matrix.package }} ${{ matrix.version }}
        run: |
          uv sync --frozen
          uv pip install "${{ matrix.package }}==${{ matrix.version }}"
          uv pip show ${{ matrix.package }}

      - name: Run tests
        run: uv run --no-sync pytest
